name: release

# Publishes a GitHub Release, and signed multi-architecture container images, when a version tag such as v0.2.0 is pushed.
# How to cut one, and what protects it: docs/RELEASING.md.
#
#   verify   the tag is `v` + __version__, CHANGELOG.md has a section for it, and the tagged commit is on main (a pre-release such
#            as v0.2.0-beta.1, which installs only receive on the beta channel, may instead be on the beta branch)
#   test     backend tests and the frontend build
#   images   build + push the app and updater images (linux/amd64 and linux/arm64), sign each with cosign (keyless, GitHub's
#            identity) and attest its provenance. The only job that can write packages or request a signing identity.
#   publish  `gh release create` with the notes and files made earlier. The only job that can write to the repository; it
#            checks nothing out and runs none of our code.
#
# Nothing here uses a secret other than the workflow's own short-lived token. A tag whose checks fail publishes nothing.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the whole history, so main can be compared with the tagged commit
          persist-credentials: false
      - name: The tag matches the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_check.py check "$TAG"
      - name: The tagged commit is on main (or, for a pre-release, on beta)
        env:
          TAG: ${{ github.ref_name }}
          TAGGED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/main; then
            exit 0
          fi
          case "$TAG" in
            *-beta.*)
              git fetch --no-tags origin beta:refs/remotes/origin/beta || true
              if git rev-parse --verify --quiet refs/remotes/origin/beta >/dev/null \
                  && git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/beta; then
                exit 0
              fi
              echo "error: $TAGGED_COMMIT is on neither main nor beta" >&2
              exit 1
              ;;
          esac
          echo "error: $TAGGED_COMMIT is not on main; merge it first and tag the merge commit" >&2
          exit 1
      # Made here, with the checked-out code, so the job that may write to the repository runs none of it.
      - name: The release notes and the files to attach
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          python3 scripts/release_check.py notes "${TAG#v}" > release/notes.md
          cp docker-compose.yml release/docker-compose.yml
          (cd release && sha256sum docker-compose.yml > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          cd backend && pytest -q
      - name: Frontend build
        run: |
          cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npm run build

  images:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # push the images
      id-token: write         # sign and attest with this run's identity
      attestations: write
    strategy:
      matrix:
        include:
          - name: lorapedia
            dockerfile: docker/Dockerfile
          - name: lorapedia-updater
            dockerfile: docker/Dockerfile.updater
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/teamharriscali/${{ matrix.name }}
          # 1.2.3 and 1.2 for every release; "latest" only for stable ones (not 1.2.3-rc.1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          flavor: latest=auto
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Sign the image by digest (keyless)
        env:
          IMAGE: ghcr.io/teamharriscali/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          # GitHub's OIDC endpoint occasionally answers with a non-JSON error for a moment (it did once, for v0.1.1);
          # signing the same digest again is harmless, so retry a few times before failing the release.
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}"; then exit 0; fi
            echo "signing attempt ${attempt} failed" >&2
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/teamharriscali/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The only job that can write to the repository. It checks nothing out and runs no script of ours.
  publish:
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write         # creating the release is the only thing that writes
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          flags=""
          case "${version%%+*}" in *-*) flags="--prerelease" ;; esac      # 1.0.0-rc.1 is a pre-release
          gh release create "$TAG" release/docker-compose.yml release/SHA256SUMS \
            --verify-tag --title "LoRaPedia $version" --notes-file release/notes.md $flags
