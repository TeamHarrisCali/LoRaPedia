version: 2
updates:
  # Keeps the pinned action SHAs, base-image digests and dependencies current, as reviewable pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
