# LoRaPedia + Ollama + an updater.   Start:  docker compose up -d     Open:  http://localhost:8000
#
# Everything runs locally. The only internet use is when YOU press a download button (a model, a Wikipedia file) and the
# update checks described below, which you can switch off in Settings -> Updates.
#
# UPDATES. The `updater` service checks this project's GitHub releases and, when Settings -> Updates allows, replaces the
# `lorapedia` container with the newest release after verifying its signature (it rolls back if the new version does not
# come up healthy). It is the only container that holds the Docker socket; the app, which processes text from the mesh,
# never does. To update by hand instead, remove the `updater` service and run:  docker compose pull && docker compose up -d
# The updater records which image to run in a `.env` file next to this one (LORAPEDIA_IMAGE=...). Details: docs/UPDATING.md.
#
# Developing? docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

x-hardening: &hardening
  # None of these services needs root's powers.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  lorapedia:
    image: ${LORAPEDIA_IMAGE:-ghcr.io/teamharriscali/lorapedia:latest}
    <<: *hardening
    read_only: true            # the image's files cannot be changed from inside; /data and /tmp are the writable places
    tmpfs: ["/tmp"]
    depends_on:
      - ollama
    ports:
      # Published on this computer only. The web interface has NO PASSWORD: change "127.0.0.1:" only on a network you trust
      # and never expose it to the internet (see README, "Security").
      - "127.0.0.1:8000:8000"
    volumes:
      - lorapedia-data:/data                       # databases, Wikipedia files, settings
      - updater-state:/run/lorapedia-updater:ro    # the token the app uses to ask the updater (read-only)
    environment:
      LORAPEDIA_OLLAMA_URL: http://ollama:11434
      LORAPEDIA_UPDATER_URL: http://updater:8081
      LORAPEDIA_UPDATER_TOKEN_FILE: /run/lorapedia-updater/token

    # --- USB radio (Linux) -----------------------------------------------------------------------------------------
    # 1. Find the port:   ls /dev/ttyACM* /dev/ttyUSB*
    # 2. Uncomment the two blocks below and use YOUR port.
    # 3. Radio page -> "Automatic (USB)" or "USB, choose the port" -> /dev/ttyACM0
    # `group_add` lets the non-root container user open the device: use the numeric group id of the device's group
    # (stat -c %g /dev/ttyACM0). Some radios (e.g. RAK4631) re-appear when the port is closed, so after unplugging or a
    # radio reset you may need `docker compose restart lorapedia`. A WiFi/network radio avoids this.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    # group_add:
    #   - "20"        # "dialout" on Debian/Ubuntu is 20; on Arch it is "uucp" (look it up with the stat command above)
    #
    # Bluetooth is not supported inside Docker; run ./run.sh for BLE.

  updater:
    image: ${LORAPEDIA_UPDATER_IMAGE:-ghcr.io/teamharriscali/lorapedia-updater:latest}
    <<: *hardening
    # It is root in its container but every capability is dropped, except the two it needs to edit LORAPEDIA_IMAGE in the
    # .env next to this file: DAC_OVERRIDE (write in a folder you own) and CHOWN (give the file back to you afterwards).
    cap_add: [DAC_OVERRIDE, CHOWN]
    read_only: true
    tmpfs: ["/tmp"]
    # No `ports:`: only the app, on this Compose network, can reach it, and only with the shared token.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent on the host: this is why it is a separate, tiny container
      - ./:/project                                 # it edits only LORAPEDIA_IMAGE in .env here, then runs `docker compose up -d lorapedia`
      - updater-state:/state                        # its status and the shared token

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama   # downloaded models live here
    # NVIDIA GPU (optional; needs the NVIDIA Container Toolkit). Uncomment to use it:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  lorapedia-data:
  ollama-models:
  updater-state:
