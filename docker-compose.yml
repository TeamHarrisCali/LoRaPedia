# LoRaPedia + Ollama + an updater.   Start:  docker compose up -d     Open:  http://localhost:8000
#
# Everything runs locally. The only internet use is when YOU press a download button (a model, a Wikipedia file) and the
# update checks described below, which you can switch off in Settings -> Updates.
#
# UPDATES. The `updater` service checks this project's GitHub releases and, when Settings -> Updates allows, replaces the
# `lorapedia` container with the newest release after verifying its signature (it rolls back if the new version does not
# come up healthy). It is the only container that holds the Docker socket; the app, which processes text from the mesh,
# never does. To update by hand instead, remove the `updater` service and run:  docker compose pull && docker compose up -d
# The updater records which image to run in a `.env` file next to this one (LORAPEDIA_IMAGE=...). Details: docs/UPDATING.md.
#
# Developing? docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

x-hardening: &hardening
  # None of these services needs root's powers.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  lorapedia:
    image: ${LORAPEDIA_IMAGE:-ghcr.io/teamharriscali/lorapedia:latest}
    <<: *hardening
    read_only: true            # the image's files cannot be changed from inside; /data and /tmp are the writable places
    tmpfs: ["/tmp"]
    # USB RADIO, AUTOMATIC. Any Meshtastic radio plugged into USB is found, whatever its brand, whichever of these ports it uses, and
    # whenever it is plugged in (or comes back after a reset): nothing to edit here. How, and what it costs:
    #   * /dev is mounted READ-ONLY beside the container's own at /hostdev, and the two device rules below allow opening only USB
    #     serial ports (ttyACM*, ttyUSB*). Every other device file is visible by name but cannot be opened.
    #   * The device file's GROUP differs from computer to computer, so the container STARTS AS ROOT with just SETUID and SETGID
    #     (every other capability dropped). docker/entrypoint.sh reads the groups of the serial devices, then becomes the unprivileged
    #     user (uid 10001) with those groups, drops every capability, and only then starts the app. The app never runs as root.
    #   * A radio plugged in LATER whose group was not seen at start needs `docker compose restart lorapedia` once.
    # Not wanted? Delete `user`, `cap_add`, `device_cgroup_rules`, the /dev line and LORAPEDIA_DEVICE_DIR (a WiFi radio needs none).
    user: "0:0"
    # Named explicitly so that an IMAGE WITHOUT the entrypoint (a release before this one) fails to start instead of silently running
    # the app as root. Update the image first (Settings -> Updates), then use this file.
    entrypoint: ["lorapedia-entrypoint"]
    cap_add: [SETUID, SETGID]
    device_cgroup_rules:
      - "c 166:* rmw"          # USB serial, ACM class: boards with native USB (RAK4631, T-Echo, Heltec V3, T-Beam Supreme...)
      - "c 188:* rmw"          # USB serial, USB-to-serial chips (CP210x, CH340, FTDI): T-Beam, T-LoRa, Heltec V2...
    depends_on:
      - ollama
    ports:
      # Published on this computer only. The web interface has NO PASSWORD: change "127.0.0.1:" only on a network you trust
      # and never expose it to the internet (see README, "Security").
      - "127.0.0.1:8000:8000"
    volumes:
      - lorapedia-data:/data                       # databases, Wikipedia files, settings
      - updater-state:/run/lorapedia-updater:ro    # the token the app uses to ask the updater (read-only)
      - /dev:/hostdev:ro                           # the host's device files, beside the container's own (see "USB RADIO" above)
    environment:
      LORAPEDIA_DEVICE_DIR: /hostdev
      LORAPEDIA_OLLAMA_URL: http://ollama:11434
      LORAPEDIA_UPDATER_URL: http://updater:8081
      LORAPEDIA_UPDATER_TOKEN_FILE: /run/lorapedia-updater/token

    # --- A GPU, a different port: put them in docker-compose.override.yml -------------------------------------------------
    # Copy docker-compose.override.example.yml to docker-compose.override.yml and edit it. Compose loads that file by itself and the
    # updater includes it when it replaces this container, so it survives updates. It is ignored by git.
    # Bluetooth radios are not supported inside Docker: use ./run.sh. A WiFi/network radio needs none of the above.

  updater:
    image: ${LORAPEDIA_UPDATER_IMAGE:-ghcr.io/teamharriscali/lorapedia-updater:latest}
    <<: *hardening
    # It is root in its container but every capability is dropped, except the two it needs to edit LORAPEDIA_IMAGE in the
    # .env next to this file: DAC_OVERRIDE (write in a folder you own) and CHOWN (give the file back to you afterwards).
    cap_add: [DAC_OVERRIDE, CHOWN]
    read_only: true
    tmpfs: ["/tmp"]
    # No `ports:`: only the app, on this Compose network, can reach it, and only with the shared token.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent on the host: this is why it is a separate, tiny container
      - ./:/project                                 # it edits only LORAPEDIA_IMAGE in .env here, then runs `docker compose up -d lorapedia`
      - updater-state:/state                        # its status and the shared token

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama   # downloaded models live here
    environment:
      # LoRaPedia's prompts are small. Ollama's default context made llama3.2:3b occupy about 4 GB of GPU memory here; 4096 needs
      # about 2.4 GB, so the chat and embedding models both fit a 4 GB card. Raise it if you raise "Passages retrieved" above ~10.
      OLLAMA_CONTEXT_LENGTH: "4096"
      # NVIDIA GPUs compile kernels the first time. Without a persistent cache, the first answer after this container is RECREATED
      # (not restarted) takes about two minutes. Kept in the volume, the second time takes seconds (measured: 127 s, then 5 s).
      CUDA_CACHE_PATH: /root/.ollama/cuda-cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    # NVIDIA GPU: needs the NVIDIA Container Toolkit. Put the `deploy:` block from docker-compose.override.example.yml into your
    # docker-compose.override.yml (machine-specific settings belong there, not in this file).

volumes:
  lorapedia-data:
  ollama-models:
  updater-state:
