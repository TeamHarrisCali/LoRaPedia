[project]
name = "lorapedia"
version = "0.1.0"
description = "Offline Wikipedia Q&A node for Meshtastic LoRa meshes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "libzim>=3.4",
    "sqlite-vec>=0.1.6",
    "meshtastic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorapedia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
