# Machine-specific settings for docker-compose.yml. Copy this file to docker-compose.override.yml and edit it:
#
#     cp docker-compose.override.example.yml docker-compose.override.yml
#
# Docker Compose loads docker-compose.override.yml by itself, the updater includes it when it replaces the app container (so
# these survive automatic updates), and git ignores it, so `git pull` never conflicts with it. This example file does nothing
# on its own. Delete what you do not need.

# A USB radio needs nothing here: docker-compose.yml finds any Meshtastic radio on USB by itself.
#
# A different port (uncomment both lines). The web interface has NO PASSWORD: keep 127.0.0.1 unless you trust the whole network
# (see README, Security).
#
#   lorapedia:
#     ports: !override ["127.0.0.1:8080:8000"]

services:
  ollama:
    # --- NVIDIA GPU (needs the NVIDIA Container Toolkit: see docs/MIGRATING.md) ------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
